<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatAgen — Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/auth.js"></script>
<script>Auth.redirectIfAuthenticated();</script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand"><span class="dot"></span> GreatAgen</div>
      <h1>Welcome back</h1>
      <p>Log in to manage your AI agents, voice, and omni inbox.</p>
    </div>
    <div class="auth-card card">
      <h2>Log in</h2>
      <p class="auth-sub" id="login-sub">Use the account you created on this device.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="li-email">Email</label>
          <input type="email" id="li-email" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <div class="field-label-row">
            <label for="li-password">Password</label>
            <a class="forgot-link" href="forgot-password.html">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input type="password" id="li-password" name="password" autocomplete="current-password" placeholder="Your password" required>
            <button type="button" class="password-toggle" onclick="Auth.togglePassword('li-password', this)" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <p class="auth-error hidden" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="login-btn">Log in</button>
      </form>
      <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </div>
<script>
(function(){
  const prefill = Auth.consumeLoginPrefill();
  if(prefill){
    if(prefill.email) document.getElementById('li-email').value = prefill.email;
    if(prefill.password) document.getElementById('li-password').value = prefill.password;
    const sub = document.getElementById('login-sub');
    if(sub && prefill.name){
      sub.textContent = 'Welcome, ' + prefill.name + ' — your details are filled in. Click Log in to continue.';
    }
  }
})();

document.getElementById('login-form').addEventListener('submit', function(e){
  e.preventDefault();
  const err = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  err.classList.add('hidden');
  btn.disabled = true;
  const result = Auth.login({
    email: document.getElementById('li-email').value,
    password: document.getElementById('li-password').value
  });
  if(!result.ok){
    err.textContent = result.error;
    err.classList.remove('hidden');
    btn.disabled = false;
    return;
  }
  location.replace(Auth.PATHS.dashboard);
});
</script>
</body>
</html>
