<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatAgen — Forgot password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/auth.js"></script>
<script>Auth.redirectIfAuthenticated();</script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand"><span class="dot"></span> GreatAgen</div>
      <h1>Reset password</h1>
      <p>Enter your account email and choose a new password. Demo reset works on this device only.</p>
    </div>
    <div class="auth-card card">
      <h2>Forgot password</h2>
      <p class="auth-sub">We’ll verify your email locally, then set a new password.</p>
      <form id="forgot-form" novalidate>
        <div class="field">
          <label for="fp-email">Email</label>
          <input type="email" id="fp-email" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="fp-password">New password</label>
          <div class="password-wrap">
            <input type="password" id="fp-password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required>
            <button type="button" class="password-toggle" onclick="Auth.togglePassword('fp-password', this)" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="fp-confirm">Confirm new password</label>
          <div class="password-wrap">
            <input type="password" id="fp-confirm" name="confirmPassword" autocomplete="new-password" placeholder="Repeat password" required>
            <button type="button" class="password-toggle" onclick="Auth.togglePassword('fp-confirm', this)" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <p class="auth-error hidden" id="forgot-error" role="alert"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="forgot-btn">Reset password</button>
      </form>
      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
<script>
document.getElementById('forgot-form').addEventListener('submit', function(e){
  e.preventDefault();
  const err = document.getElementById('forgot-error');
  const btn = document.getElementById('forgot-btn');
  err.classList.add('hidden');
  btn.disabled = true;
  const result = Auth.resetPassword({
    email: document.getElementById('fp-email').value,
    newPassword: document.getElementById('fp-password').value,
    confirmPassword: document.getElementById('fp-confirm').value
  });
  if(!result.ok){
    err.textContent = result.error;
    err.classList.remove('hidden');
    btn.disabled = false;
    return;
  }
  location.replace(Auth.PATHS.login);
});
</script>
</body>
</html>
