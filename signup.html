<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GreatAgen — Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="js/auth.js"></script>
<script>Auth.redirectIfAuthenticated();</script>
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand"><span class="dot"></span> GreatAgen</div>
      <h1>Create your account</h1>
      <p>Set up your workspace and start building AI agents in minutes.</p>
    </div>
    <div class="auth-card card">
      <h2>Sign up</h2>
      <p class="auth-sub">Name, email, and password — demo accounts are stored locally on this device.</p>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="su-name">Full name</label>
          <input type="text" id="su-name" name="name" autocomplete="name" placeholder="Jane Smith" required>
        </div>
        <div class="field">
          <label for="su-email">Email</label>
          <input type="email" id="su-email" name="email" autocomplete="email" placeholder="you@company.com" required>
        </div>
        <div class="field">
          <label for="su-password">Password</label>
          <div class="password-wrap">
            <input type="password" id="su-password" name="password" autocomplete="new-password" placeholder="At least 6 characters" required>
            <button type="button" class="password-toggle" onclick="Auth.togglePassword('su-password', this)" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="field">
          <label for="su-confirm">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="su-confirm" name="confirmPassword" autocomplete="new-password" placeholder="Repeat password" required>
            <button type="button" class="password-toggle" onclick="Auth.togglePassword('su-confirm', this)" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <p class="auth-error hidden" id="signup-error" role="alert"></p>
        <button type="submit" class="btn btn-primary auth-submit" id="signup-btn">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
<script>
document.getElementById('signup-form').addEventListener('submit', function(e){
  e.preventDefault();
  const err = document.getElementById('signup-error');
  const btn = document.getElementById('signup-btn');
  err.classList.add('hidden');
  btn.disabled = true;
  const result = Auth.signup({
    name: document.getElementById('su-name').value,
    email: document.getElementById('su-email').value,
    password: document.getElementById('su-password').value,
    confirmPassword: document.getElementById('su-confirm').value
  });
  if(!result.ok){
    err.textContent = result.error;
    err.classList.remove('hidden');
    btn.disabled = false;
    return;
  }
  location.replace(Auth.PATHS.login);
});
</script>
</body>
</html>
